[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "auditory_sim"
version = "0.1.0"
description = "Auditory neuroscience simulation: cochlea to cortex, with spiking and deep neural networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["auditory_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
